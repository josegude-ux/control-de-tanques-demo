<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#182a42"><title>Control de Tanques | Comparativa A/B</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.5;color:#182536;background:#f5f6fa}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #277de6;outline-offset:2px}button:disabled{opacity:.4;cursor:not-allowed}.wrap{max-width:1120px;margin:auto;padding:18px 18px 80px}.tiny{font-size:13px}.muted{color:#687482}.topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}.eyebrow{font-size:12px;letter-spacing:.12em;font-weight:800;text-transform:uppercase}.switch{display:flex;gap:6px;background:#e7ebf2;border-radius:16px;padding:5px}.switch button{border:0;background:transparent;border-radius:12px;padding:12px 17px;font-weight:800}.switch button.on{background:#fff;box-shadow:0 1px 5px #0002}.notice{background:#fff9d8;border:1px solid #ebd88a;border-radius:12px;padding:12px 16px;font-size:13px;margin-bottom:20px}.pill{border-radius:100px;border:1px solid currentColor;padding:5px 10px;font-weight:800;font-size:12px;display:inline-flex}.btn{border:0;border-radius:14px;padding:15px 20px;min-height:50px;font-weight:800;background:#1758b0;color:white}.btn.soft{background:#e8eef7;color:#244162}.btn.danger{background:#ffe7e5;color:#922b2b}.btn.success{background:#117e5b}.btn:disabled{opacity:.42}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.spread{display:flex;justify-content:space-between;gap:12px;align-items:center}.card{background:white;border:1px solid #e0e5ee;border-radius:22px;padding:22px;box-shadow:0 3px 12px #1c355510}.card h2,.card h3{margin-top:0}.label{font-size:13px;font-weight:800;display:block;margin-bottom:6px}.input{width:100%;padding:14px;border:1.5px solid #c6cfde;border-radius:14px;background:white;min-height:52px;color:#1a2738}.box{border:2px solid #dce4ed;background:#f9fbfe;border-radius:18px;padding:18px;text-align:left}.selectable{cursor:pointer;width:100%;color:inherit}.selectable.active{border-color:#1359bd;background:#eaf3ff}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.actions{display:flex;gap:10px;justify-content:space-between;margin-top:22px}.actions button{min-width:105px}h1{font-size:clamp(27px,4vw,38px);margin:7px 0 8px;line-height:1.17}h2{font-size:21px}.stepper{display:flex;gap:6px;margin:24px 0}.stepper span{flex:1;height:7px;background:#d8dee8;border-radius:10px}.stepper span.done{background:#1761bd}.wizard{max-width:590px;margin:auto}.wizard .card{min-height:350px}.wizard h2{margin-bottom:22px}.choice{font-weight:800;font-size:19px;padding:23px 18px}.choice small{display:block;font-size:13px;color:#647084;font-weight:500;margin-top:5px}.formgrid{display:grid;gap:16px}.numeric{font-size:34px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}.summary{margin:0;padding:0;list-style:none}.summary li{padding:13px 0;border-bottom:1px solid #e9ebef;display:flex;justify-content:space-between;gap:16px}.summary strong{text-align:right}.status{margin-top:16px;padding:12px;border-radius:12px;background:#e5f5ec;color:#126840;font-weight:700}.error{background:#fff0ef;color:#a31e24}.history{font-size:13px}.history li{padding:9px 0;border-bottom:1px solid #dde4ee}.history ul{padding-left:20px}.board{background:#0f1927;color:#f7fbff;min-height:100vh}.board .muted{color:#b1bdcf}.board .switch{background:#28384f}.board .switch button.on{color:#0f1927}.board .notice{background:#2d302a;color:#f7eaa9;border-color:#696345}.board .card{background:#1b293b;border:1px solid #35445b;color:#f9fbfe;box-shadow:none}.board .label{color:#ccd7e6}.board .input{color:#102236}.board .btn.soft{background:#33435a;color:white}.board h1{color:white}.board .pill{color:#b7e1ce}.kpi{font-size:28px;font-weight:900;line-height:1.2}.tank{border:1px solid #374b63;border-radius:18px;padding:15px;background:#233349}.tank h3{margin:0}.tank .litres{font-size:27px;font-weight:900;margin:9px 0}.meter{height:14px;background:#111e2c;border-radius:30px;overflow:hidden}.meter span{display:block;background:#34b788;height:100%;border-radius:30px}.tank .row{margin-top:14px}.tank button{flex:1;min-width:110px}.board-section{margin:24px 0}.board .history li{border-color:#34475d}.board .history{background:#1b293b}.modalBackdrop{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}.modal{width:min(100%,490px);border-radius:22px;padding:24px;background:white;color:#17293e;max-height:94vh;overflow-y:auto}.modal h2{margin:0 0 16px}.modal .formgrid{gap:15px}.modal .status{margin-bottom:15px}.foot{font-size:13px;margin-top:22px}.hidden{display:none!important}
@media(max-width:700px){.grid3,.grid2{grid-template-columns:1fr}.wrap{padding:14px 13px 76px}.card{padding:18px}.topbar{align-items:stretch}.switch{width:100%}.switch button{flex:1}.tank .row .btn{padding:14px 8px}.summary li{font-size:14px}}
</style></head><body>
<div id="app"></div>
<script>
(function(){
"use strict";
var VERSION="2026-10-24-1";
var CLIENTS={"Bar Atlántico":{capacity:250,litres:75},"Hotel Norte":{capacity:500,litres:200},"Restaurante Plaza":{capacity:250,litres:125}};
var VEHICLES={"Camión":{capacity:1000,tanks:[700,420,250]},"Furgoneta":{capacity:1000,tanks:[300]}};
var CURRENT=new URLSearchParams(location.search).get("modo");
var mode=CURRENT==="B"?"B":"A";
var state,stage=1,form={type:"carga",vehicle:"Camión",tank:0,client:"Bar Atlántico",litres:""},quick=null,notice="";
function sample(){return{cistern:25000,vehicles:JSON.parse(JSON.stringify(VEHICLES)),clients:JSON.parse(JSON.stringify(CLIENTS)),history:[]};}
function key(){return"tanques-demo-solo-local-"+VERSION+"-"+mode;}
function load(){try{var saved=JSON.parse(localStorage.getItem(key()));return saved&&saved.vehicles&&saved.clients&&Array.isArray(saved.history)?saved:sample();}catch(e){return sample();}}
function save(){localStorage.setItem(key(),JSON.stringify(state));}
function clean(v){return String(v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function fmt(v){return Number(v).toLocaleString("es-ES",{maximumFractionDigits:2})+" L";}
function remaining(v,t){return v.capacity-v.tanks[t];}
function entry(v,t){return state.vehicles[v].tanks[t];}
function button(title,classes,id,disabled){return '<button type="button" class="'+(classes||"btn")+'" '+(id||"")+(disabled?" disabled":"")+">"+title+"</button>";}
function navTitle(){return '<div class="topbar"><div><div class="eyebrow">MAHOU · Control de Tanques / comparativa</div><h1>'+(mode==="A"?"A · Operación guiada":"B · Centro de operaciones")+'</h1><div class="muted tiny">'+(mode==="A"?"Un paso por pantalla, confirmación de un tanque":"Visión de existencias y acciones directas por tanque")+'</div></div><div class="switch" role="group" aria-label="Elegir enfoque">'+button("A · Guiado",mode==="A"?"on":"","data-mode=A")+button("B · Panel",mode==="B"?"on":"","data-mode=B")+'</div></div>';}
function disclaimer(){return '<div class="notice"><strong>SIMULACIÓN, SIN DATOS REALES.</strong> Los movimientos de esta comparativa se guardan solo en este navegador, por separado para A y B. No hay conexión a Supabase ni cambios en producción.</div>';}
function history(){var items=state.history.slice().reverse();return '<div class="history"><h3>Movimientos simulados</h3>'+(items.length?'<ul>'+items.slice(0,8).map(function(h){return'<li><strong>'+clean(h.action)+'</strong> · '+clean(h.vehicle)+' · tanque '+h.tank+(h.client?' → '+clean(h.client):'')+' · '+fmt(h.litres)+'<div class="muted">'+clean(h.time)+'</div></li>';}).join("")+'</ul>':'<p class="muted">Todavía no hay movimientos.</p>')+'</div>';}
function header(){return navTitle()+disclaimer();}
function formOptions(list,selected){return list.map(function(item){return'<option value="'+clean(item)+'"'+(item===selected?' selected':'')+'>'+clean(item)+'</option>';}).join("");}
function validate(type,vehicle,tank,client,litres){if(!Number.isFinite(litres)||litres<=0)return"Introduce una cantidad mayor que cero.";if(!state.vehicles[vehicle])return"Vehículo no válido.";if(!Number.isInteger(tank)||tank<0||tank>=state.vehicles[vehicle].tanks.length)return"Tanque no válido.";if(type==="carga"){if(litres>remaining(state.vehicles[vehicle],tank))return"Supera la capacidad libre del tanque.";if(litres>state.cistern)return"La cisterna no tiene suficientes litros.";}else{if(!state.clients[client])return"Selecciona un cliente.";if(litres>entry(vehicle,tank))return"No hay suficientes litros en el tanque del vehículo.";if(litres>state.clients[client].capacity-state.clients[client].litres)return"No cabe esa cantidad en el tanque del cliente.";}return"";}
function apply(type,vehicle,tank,client,litres){var err=validate(type,vehicle,tank,client,litres);if(err)return err;litres=Math.round(litres*100)/100;if(type==="carga"){state.cistern=Math.round((state.cistern-litres)*100)/100;state.vehicles[vehicle].tanks[tank]=Math.round((entry(vehicle,tank)+litres)*100)/100;}else{state.vehicles[vehicle].tanks[tank]=Math.round((entry(vehicle,tank)-litres)*100)/100;state.clients[client].litres=Math.round((state.clients[client].litres+litres)*100)/100;}state.history.push({action:type==="carga"?"CARGA":"DESCARGA",vehicle:vehicle,tank:tank+1,client:type==="descarga"?client:null,litres:litres,time:new Date().toLocaleString("es-ES")});save();return"";}
function startStep(){return'<div class="grid2"><button class="box selectable choice '+(form.type==="carga"?"active":"")+'" data-type="carga">↑ Cargar vehículo<small>De cisterna a un compartimento</small></button><button class="box selectable choice '+(form.type==="descarga"?"active":"")+'" data-type="descarga">↓ Descargar a cliente<small>De un compartimento al tanque del cliente</small></button></div>';}
function vehicleStep(){var v=state.vehicles[form.vehicle];var tanks=v.tanks.map(function(x,i){return'Tanque '+(i+1)+' · '+fmt(x)+' / '+fmt(v.capacity);});return'<div class="formgrid"><label><span class="label">Vehículo</span><select class="input" id="vehicle">'+formOptions(Object.keys(state.vehicles),form.vehicle)+'</select></label><label><span class="label">Compartimento (uno por operación)</span><select class="input" id="tank">'+tanks.map(function(s,i){return'<option value="'+i+'"'+(i===form.tank?' selected':'')+'>'+clean(s)+'</option>';}).join("")+'</select></label>'+(form.type==="descarga"?'<label><span class="label">Cliente</span><select class="input" id="client">'+formOptions(Object.keys(state.clients),form.client)+'</select></label>':'')+'</div>';}
function litresStep(){var max=form.type==="carga"?Math.min(remaining(state.vehicles[form.vehicle],form.tank),state.cistern):Math.min(entry(form.vehicle,form.tank),state.clients[form.client].capacity-state.clients[form.client].litres);return'<p class="muted">Introduce los litros de esta operación. Puedes introducir decimales.</p><label><span class="label">Cantidad en litros</span><input class="input numeric" id="litres" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0" value="'+clean(form.litres)+'"></label><p class="muted">Máximo disponible: <strong>'+fmt(Math.max(0,max))+'</strong></p>';}
function reviewStep(){return'<p class="muted">Revisa los datos antes de registrar la operación.</p><ul class="summary"><li>Movimiento<strong>'+(form.type==="carga"?"CARGA":"DESCARGA")+'</strong></li><li>Vehículo<strong>'+clean(form.vehicle)+'</strong></li><li>Compartimento<strong>Tanque '+(form.tank+1)+'</strong></li>'+(form.type==="descarga"?'<li>Cliente<strong>'+clean(form.client)+'</strong></li>':'')+'<li>Litros<strong>'+fmt(Number(form.litres))+'</strong></li></ul>';}
function wizard(){var title=["","¿Qué necesitas hacer?","¿Dónde y con quién?","¿Cuántos litros?","Confirmar movimiento"];var middle=stage===1?startStep():stage===2?vehicleStep():stage===3?litresStep():reviewStep();return'<div class="wizard"><div class="stepper" aria-label="Paso '+stage+' de 4">'+[1,2,3,4].map(function(i){return'<span class="'+(i<=stage?"done":"")+'"></span>';}).join("")+'</div><div class="card"><div class="eyebrow muted">Paso '+stage+' de 4</div><h2>'+title[stage]+'</h2>'+middle+(notice?'<div class="status error" role="alert">'+clean(notice)+'</div>':'')+'<div class="actions">'+button(stage===1?"Reiniciar":"Atrás","btn soft","id=back")+button(stage===4?"Confirmar y guardar":"Continuar","btn","id=next")+'</div></div><div class="card" style="margin-top:18px"><div class="spread"><strong>Datos de la simulación</strong>'+button("Restablecer","btn soft","id=reset")+'</div><p class="tiny muted">Cisterna '+fmt(state.cistern)+' · '+state.history.length+' movimientos</p>'+history()+'</div></div>';}
function tankCard(v,i){var tank=state.vehicles[v];var stock=tank.tanks[i],pct=Math.max(0,Math.min(100,100*stock/tank.capacity));return'<div class="tank"><div class="spread"><h3>Tanque '+(i+1)+'</h3><span class="pill">'+Math.round(pct)+'%</span></div><div class="litres">'+fmt(stock)+'</div><div class="meter"><span style="width:'+pct+'%"></span></div><div class="tiny muted" style="margin-top:8px">Capacidad: '+fmt(tank.capacity)+'</div><div class="row">'+button("↑ Cargar","btn success",'data-quick="carga|'+v+'|'+i+'"')+button("↓ Descargar","btn",'data-quick="descarga|'+v+'|'+i+'"')+'</div></div>';}
function board(){var all=Object.keys(state.vehicles).map(function(v){return'<section class="board-section"><div class="spread"><h2>'+clean(v)+'</h2><span class="pill">'+fmt(state.vehicles[v].tanks.reduce(function(a,b){return a+b;},0))+'</span></div><div class="grid3">'+state.vehicles[v].tanks.map(function(_,i){return tankCard(v,i);}).join("")+'</div></section>';}).join("");return'<div class="grid3"><div class="card"><div class="eyebrow muted">Cisterna principal</div><div class="kpi">'+fmt(state.cistern)+'</div><div class="tiny muted">Origen de las cargas</div></div><div class="card"><div class="eyebrow muted">Vehículos</div><div class="kpi">2</div><div class="tiny muted">Camión + furgoneta</div></div><div class="card"><div class="eyebrow muted">Operaciones registradas</div><div class="kpi">'+state.history.length+'</div><div class="tiny muted">Solo simulación local</div></div></div>'+all+'<div class="grid2"><div class="card"><h2>Tanques de clientes</h2>'+Object.keys(state.clients).map(function(c){var o=state.clients[c];return'<div class="spread" style="border-bottom:1px solid #35445b;padding:12px 0"><strong>'+clean(c)+'</strong><span>'+fmt(o.litres)+' / '+fmt(o.capacity)+'</span></div>';}).join("")+'</div><div class="card"><div class="spread"><h2>Actividad reciente</h2>'+button("Restablecer","btn soft","id=reset")+'</div>'+history()+'</div></div>';}
function quickDialog(){if(!quick)return"";var v=quick.vehicle,t=quick.tank,type=quick.type, max=type==="carga"?Math.min(remaining(state.vehicles[v],t),state.cistern):entry(v,t);return'<div class="modalBackdrop" id="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="eyebrow muted">Acción directa</div><h2 id="dialogTitle">'+(type==="carga"?"↑ Cargar tanque":"↓ Descargar tanque")+'</h2><p>'+clean(v)+' · tanque '+(t+1)+' · '+fmt(entry(v,t))+' disponibles ahora</p><div class="formgrid">'+(type==="descarga"?'<label><span class="label">Cliente</span><select id="quickClient" class="input">'+formOptions(Object.keys(state.clients),quick.client)+'</select></label>':'')+'<label><span class="label">Litros</span><input class="input numeric" id="quickLitres" type="number" min=".01" step=".01" inputmode="decimal" value="'+clean(quick.litres)+'" placeholder="0"></label></div><p class="muted tiny">Disponible antes de elegir cliente: '+fmt(Math.max(0,max))+'</p>'+(notice?'<div class="status error" role="alert">'+clean(notice)+'</div>':'')+'<div class="actions">'+button("Cancelar","btn soft","id=cancelQuick")+button("Guardar movimiento","btn success","id=saveQuick")+'</div></div></div>';}
function render(){document.body.className=mode==="B"?"board":"";document.getElementById("app").innerHTML='<div class="wrap">'+header()+(mode==="A"?wizard():board())+'<div class="foot muted">A y B usan las mismas capacidades y validaciones. No crean movimientos reales. Versión de comparativa '+VERSION+'.</div></div>'+(mode==="B"?quickDialog():"");}
function changeMode(to){mode=to;state=load();stage=1;form={type:"carga",vehicle:"Camión",tank:0,client:"Bar Atlántico",litres:""};quick=null;notice="";history.replaceState(null,"",location.pathname+"?modo="+mode);render();}
function readWizard(){var vehicle=document.getElementById("vehicle"),tank=document.getElementById("tank"),client=document.getElementById("client"),litres=document.getElementById("litres");if(vehicle)form.vehicle=vehicle.value;if(tank)form.tank=Number(tank.value);if(client)form.client=client.value;if(litres)form.litres=litres.value;}
document.addEventListener("change",function(e){if(mode!=="A")return;if(e.target.id==="vehicle"){form.vehicle=e.target.value;form.tank=0;render();}else if(e.target.id==="tank"||e.target.id==="client")readWizard();});
document.addEventListener("input",function(e){if(e.target.id==="litres")form.litres=e.target.value;if(e.target.id==="quickLitres"&&quick)quick.litres=e.target.value;if(e.target.id==="quickClient"&&quick)quick.client=e.target.value;});
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var m=b.getAttribute("data-mode");if(m){changeMode(m);return;}if(b.id==="reset"){if(confirm("¿Reiniciar los datos ficticios solo de la opción "+mode+"?")){state=sample();save();stage=1;quick=null;notice="";render();}return;}
var type=b.getAttribute("data-type");if(type){form.type=type;notice="";render();return;}
if(mode==="A"){if(b.id==="back"){notice="";if(stage>1)stage--;else{state=sample();save();}render();return;}if(b.id==="next"){readWizard();notice="";if(stage===3){notice=validate(form.type,form.vehicle,form.tank,form.client,Number(form.litres));if(notice){render();return;}}if(stage<4){stage++;render();return;}notice=apply(form.type,form.vehicle,form.tank,form.client,Number(form.litres));if(!notice){form.litres="";stage=1;}render();return;}}
if(mode==="B"){var q=b.getAttribute("data-quick");if(q){var a=q.split("|");quick={type:a[0],vehicle:a[1],tank:Number(a[2]),client:"Bar Atlántico",litres:""};notice="";render();setTimeout(function(){document.getElementById("quickLitres").focus();},0);return;}if(b.id==="cancelQuick"){quick=null;notice="";render();return;}if(b.id==="saveQuick"&&quick){var litres=Number(quick.litres);notice=apply(quick.type,quick.vehicle,quick.tank,quick.client,litres);if(!notice)quick=null;render();return;}}});
window.addEventListener("storage",function(e){if(e.key===key()){state=load();render();}});
state=load();render();
})();
</script></body></html>
